<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3a3e"/><stop offset=".55" stop-color="#121214"/><stop offset="1" stop-color="#000"/></linearGradient>
    <radialGradient id="sheen" cx=".5" cy="-.05" r=".75"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".6" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#ececee"/><stop offset="1" stop-color="#bdbdc2"/></linearGradient>
    <filter id="depth" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22" result="b1"/><feOffset in="b1" dy="26" result="o1"/>
      <feComponentTransfer in="o1" result="s1"><feFuncA type="linear" slope=".75"/></feComponentTransfer>
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="b2"/><feOffset in="b2" dy="6" result="o2"/>
      <feComponentTransfer in="o2" result="s2"><feFuncA type="linear" slope=".6"/></feComponentTransfer>
      <feMerge><feMergeNode in="s1"/><feMergeNode in="s2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bevel" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="6" specularConstant=".9" specularExponent="22" lighting-color="#fff" result="spec"><feDistantLight azimuth="270" elevation="55"/></feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
      <feOffset in="SourceAlpha" dy="-10" result="up"/><feComposite in="SourceAlpha" in2="up" operator="out" result="bottomEdge"/>
      <feFlood flood-color="#000" flood-opacity=".28"/><feComposite in2="bottomEdge" operator="in" result="bottomShade"/>
      <feComposite in="specIn" in2="SourceGraphic" operator="arithmetic" k1="0" k2=".35" k3="1" k4="0" result="lit"/>
      <feMerge><feMergeNode in="lit"/><feMergeNode in="bottomShade"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#sheen)"/>
  <g filter="url(#depth)"><g filter="url(#bevel)" fill="url(#mark)">
    <path fill-rule="evenodd" d="M212.0 503.1 L512.0 235.1 L812.0 503.1 L739.2 503.1 L739.2 790.7 L284.8 790.7 L284.8 503.1 Z M338.0 462.3 L512.0 315.0 L686.0 462.3 L686.0 726.8 L338.0 726.8 Z"/>
    <path d="M453.4 726.8 L453.4 473.0 L579.5 526.2 L579.5 726.8 Z"/>
  </g></g>
</svg>
